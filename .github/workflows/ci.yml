name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth=1 origin ${{ github.ref }}
          git checkout FETCH_HEAD

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, gd, curl, zip
          coverage: none

      - name: Setup MySQL
        run: |
          sudo systemctl start mysql.service
          mysqladmin ping -h127.0.0.1 -uroot -proot --silent
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS cafe_pos_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan storage:link
          php artisan migrate --seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cafe_pos_test
          DB_USERNAME: root
          DB_PASSWORD: root
          PRINT_BRIDGE_TOKEN: ci-print-bridge-token

      - name: Run backend tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cafe_pos_test
          DB_USERNAME: root
          DB_PASSWORD: root
          PRINT_BRIDGE_TOKEN: ci-print-bridge-token

      - name: Build frontend assets
        run: npm run build

      - name: Run browser tests
        run: npx playwright test
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cafe_pos_test
          DB_USERNAME: root
          DB_PASSWORD: root
          PRINT_BRIDGE_TOKEN: ci-print-bridge-token
